name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API PHP e sintaxe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite
          coverage: none
      - name: Sintaxe do PHP
        run: for f in api/*.php; do php -l "$f"; done
      - name: Sintaxe do JavaScript
        run: for f in core/*.js; do node --check "$f"; done
      - name: Testes da API (login, senha e cadastro)
        run: python3 tests/api_test.py
